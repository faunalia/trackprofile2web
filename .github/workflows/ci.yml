name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  qgis:
    runs-on: ubuntu-24.04
    container: qgis/qgis:4.2.3-trixie
    env:
      QGIS_PREFIX_PATH: /usr
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-behave python3-pyqt6.qtwebchannel python3-pyqt6.qtwebengine qt6-l10n-tools
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Run QGIS scenarios
        run: |
          python3 -m behave test/features/plugin.feature --tags=@qgis
          python3 -m behave test/features/profile.feature --tags=@qgis

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install behave==1.3.3 playwright==1.58.0
      - name: Run browser and metadata scenarios
        run: python -m behave test/features --tags="not @qgis"
