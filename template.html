<!DOCTYPE html>
<html>

<head>
  <title>QGIS Track Profile 2 Web</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
  <style>
    html,
    body,
    #map,
    #elevation-div {
      width: 100%;
      padding: 0px;
      margin: 0px;
      position: relative;
      z-index: 9999;
    }

    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    #map {
      flex: 1 1 0;
      min-height: 0;
      z-index: 1;
    }

    #elevation-div {
      flex: 0 0 auto;
      font: 12px/1.5 "Helvetica Neue", Arial, Helvetica, sans-serif;
    }
    #elevation-div svg.background { display: block; max-width: 100%; max-height: 40vh; }

    body.attached-profile #elevation-div { display: none; }

    .data-summary {
      font-family: "Lucida Grande", "Lucida Sans Unicode", Verdana, Arial, Helvetica, sans-serif;
      font-size: 12px;
      margin-left: 45px;
    }

    body.attached-profile .data-summary {
      position: absolute;
      bottom: 0;
      left: 45px;
      margin-left: 0;
    }

    .data-summary .summaryvalue {
      font-weight: bold;
    }

  </style>
  <style>
   .custom-theme.elevation-control .area path.altitude {
    fill: { area_fill_color };
    stroke: hsla(60, 0%, 0%, 0.85);
    stroke-width: { area_stroke_width };
   }

   .custom-theme.height-focus.circle-lower {
     fill: { marker_color };
   }

   .custom-theme.elevation-polyline {
     stroke: { line_color };
     stroke-opacity: { line_opacity } ;
   }
 </style>

  <!-- Leaflet (JS/CSS) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- leaflet-elevation -->
  <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation@3.0.1/dist/leaflet-elevation.min.css" />
  <script src="https://unpkg.com/@raruto/leaflet-elevation@3.0.1/dist/leaflet-elevation.min.js"></script>

</head>

<body>

  <div id="map"></div>
  <div id="elevation-div" class="leaflet-control elevation"></div>

  <div id="data-summary" class="data-summary"><span class="totlen"><span class="summarylabel">Total Length: </span><span class="summaryvalue">0</span></span> &mdash; <span class="maxele"><span class="summarylabel">Max Elevation: </span><span class="summaryvalue">0</span></span>
    &mdash; <span class="minele"><span class="summarylabel">Min Elevation: </span><span class="summaryvalue">0</span></span></div>

  <script>
    var opts = '{ py_opts }';

    document.body.classList.toggle('attached-profile', !opts.elevationControl.options.detached);
    var map = new L.Map('map', opts.map);

    var baseLayers = {};
    baseLayers.OTM = new L.TileLayer(opts.otmLayer.url, opts.otmLayer.options);

    var controlZoom = new L.Control.Zoom(opts.zoomControl);
    var controlElevation = L.control.elevation(opts.elevationControl.options).addTo(map);
    var controlLayer = L.control.layers(baseLayers, null, opts.layersControl.options);

    controlZoom.addTo(map);
    controlLayer.addTo(map);

    map.addLayer(baseLayers.OTM);

    controlElevation.on('eledata_loaded', function(e) {
      var q = document.querySelector.bind(document);
      var track = e.track_info;

      controlLayer.addOverlay(e.layer, e.name);

      q('.totlen .summaryvalue').innerHTML = track.distance.toFixed(2) + " km";
      q('.maxele .summaryvalue').innerHTML = track.elevation_max.toFixed(2) + " m";
      q('.minele .summaryvalue').innerHTML = track.elevation_min.toFixed(2) + " m";
    });

    controlElevation.load(opts.elevationControl.data);
  </script>

  <template id="qgis-preview">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; font: 14px/1.4 system-ui, sans-serif; color: #172331; background: #e8edf1; }
    .preview-area { position: relative; flex: 1 1 0; min-width: 0; height: 100%; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    button, input, select { font: inherit; }
    button, select, input:not([type="checkbox"]) { border: 1px solid #becbd4; border-radius: 6px; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid #65aaf4; outline-offset: 2px;
    }
    .panel {
      flex: 0 0 min(350px, 70vw); height: 100%; min-width: 0;
      overflow: auto; background: white; border-left: 1px solid #d5dfe6;
    }
    .panel-header { padding: 16px 18px 10px; }
    .panel-header h1 { margin: 0; font-size: 17px; }
    .panel-header p { margin: 3px 0 0; color: #536778; font-size: 12px; }
    .content { padding: 0 18px 18px; }
    label.field { display: grid; gap: 5px; margin: 12px 0; font-weight: 600; }
    select, input[type="text"], input[type="number"] {
      width: 100%; min-width: 0; min-height: 36px; padding: 6px 8px; background: white; color: #172331;
    }
    input[type="color"] { width: 100%; height: 36px; padding: 3px; background: white; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
    .check { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
    .check input { width: 16px; height: 16px; accent-color: #1b658f; }
    details { border-top: 1px solid #e3eaf0; padding: 12px 0; }
    summary { font-weight: 700; cursor: pointer; }
    .actions { display: grid; gap: 8px; }
    .actions button { padding: 9px; color: #173c59; background: #f3f7fa; }
    .actions button.primary { background: #17638b; border-color: #17638b; color: white; }
    .actions button:disabled { opacity: .5; cursor: not-allowed; }
    .status { padding: 10px 12px; border-radius: 6px; background: #eaf3f9; color: #31536a; }
    .status:empty { display: none; }
    .hint { color: #536778; font-size: 12px; }
    a { color: #17638b; }
    .notice {
      position: absolute; bottom: 12px; left: 12px; z-index: 4;
      max-width: min(460px, calc(100% - 24px)); padding: 10px 14px;
      border-radius: 6px; background: #eaf3f9; color: #173c59;
      box-shadow: 0 2px 8px #0003; overflow-wrap: anywhere;
    }
    .notice.error { background: #fff0ef; color: #8a211d; }
    .notice[hidden] { display: none; }
  </style>
  <main class="preview-area">
    <iframe id="preview" title="Map and elevation profile" src="about:blank"></iframe>
    <div id="notice" class="notice" role="alert" hidden></div>
  </main>
  <aside id="settings-panel" class="panel" aria-label="Track profile settings">
    <header class="panel-header">
      <h1>Track profile</h1>
      <p>Changes update the preview automatically.</p>
    </header>
    <div class="content">
      <div id="status" class="status" role="status">Connecting to QGIS…</div>
      <button id="retry" type="button" hidden>Retry preview</button>
      <label class="field">Line layer <select id="layer" aria-label="Line layer"></select></label>
      <label class="field">Base map
        <input id="basemap" type="text" list="basemap-options" value="OpenTopoMap" required placeholder="Choose a map or enter a tile URL">
        <datalist id="basemap-options"></datalist>
      </label>
      <details>
        <summary>Appearance</summary>
        <div class="grid">
          <label class="field">Profile color <input id="profileColor" type="color" value="#d45f5f"></label>
          <label class="field">Track color <input id="lineColor" type="color" value="#ff0000"></label>
          <label class="field">Marker color <input id="markerColor" type="color" value="#ffb800"></label>
          <label class="field">Profile width <input id="profileWidth" type="number" min="0" max="10" step="0.5" value="2.5" required></label>
          <label class="field">Marker opacity <input id="markerOpacity" type="number" min="0" max="1" step="0.05" value="0.85" required></label>
        </div>
      </details>
      <details>
        <summary>Profile and map options</summary>
        <label class="check"><input id="detached" type="checkbox" checked> Detached profile</label>
        <label class="field">Profile position
          <select id="position">
            <option value="topright">Top right</option><option value="topleft">Top left</option>
            <option value="bottomright">Bottom right</option><option value="bottomleft">Bottom left</option>
          </select>
        </label>
        <label class="check"><input id="follow" type="checkbox"> Follow track</label>
        <label class="check"><input id="collapseProfile" type="checkbox"> Collapse profile</label>
        <label class="check"><input id="autohide" type="checkbox"> Auto-hide profile</label>
        <label class="check"><input id="collapseLayers" type="checkbox"> Collapse layers</label>
      </details>
      <details open>
        <summary>Export</summary>
        <p class="hint">The exported page contains the map and profile, without these controls.</p>
        <div class="actions">
          <button class="primary" data-action="html" type="button" disabled>Export HTML</button>
          <button data-action="geojson" type="button" disabled>Export HTML + GeoJSON</button>
          <button data-action="browser" type="button" disabled>Open in browser</button>
        </div>
      </details>
      <details>
        <summary>About</summary>
        <p class="hint">2D lines use elevations from <a href="https://mapterhorn.com/">Mapterhorn</a>. The profile uses <a href="https://github.com/Raruto/leaflet-elevation">leaflet-elevation</a>.</p>
      </details>
    </div>
  </aside>
  <script>
    const frame = document.getElementById('preview');
    const status = document.getElementById('status');
    const layerSelect = document.getElementById('layer');
    const basemapOptions = document.getElementById('basemap-options');
    const settings = [...document.querySelectorAll('#settings-panel input, #settings-panel select:not(#layer)')];
    const basemaps = new Map([
      ['OpenTopoMap', {
        url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        attribution: 'Map data: &copy; <a href="http://www.openstreetmap.org/copyright">OpenTopoMap</a>, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
      }],
      ['OpenStreetMap', {
        url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        attribution: 'Map data: &copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://openstreetmap.org">OpenStreetMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
      }],
      ['WikimediaMap', {
        url: 'https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png',
        attribution: 'Map data: &copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://openstreetmap.org">OpenStreetMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
      }],
      ['Google', {url: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', attribution: ''}],
      ['ESRI Satellite Map', {
        url: 'http://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        attribution: '&copy; <a href="http://www.esri.com/">Esri</a>'
      }]
    ]);
    basemaps.forEach((value, name) => basemapOptions.appendChild(new Option(name)));
    let bridge;
    let currentPreview = '';

    function showPreview(url) {
      currentPreview = url;
      frame.src = url ? url + '?revision=' + Date.now() : 'about:blank';
    }

    function updateState() {
      bridge.state((json) => {
        const state = JSON.parse(json);
        layerSelect.replaceChildren();
        if (!state.layers.length) {
          layerSelect.add(new Option('No line layers available', ''));
        } else {
          state.layers.forEach(layer => layerSelect.add(new Option(layer.name, layer.id)));
          layerSelect.value = state.layer;
        }
        layerSelect.disabled = !state.layers.length;
        const valid = settings.every(input => input.checkValidity());
        document.querySelectorAll('[data-action]').forEach(button => button.disabled = !state.ready || !valid);
        status.textContent = !valid ? 'Please correct the settings.'
          : state.status === 'empty' ? 'Add a line layer to the QGIS project.'
          : state.status === 'updating' ? 'Updating preview…'
          : state.status === 'error' ? 'Could not update the preview. See the QGIS message below.' : '';
        document.getElementById('retry').hidden = state.status !== 'error';
        const notice = document.getElementById('notice');
        notice.hidden = !state.message;
        if (state.message) {
          notice.textContent = [state.message.title, state.message.text].filter(Boolean).join(' — ');
          notice.classList.toggle('error', state.message.error);
        }
        if (state.preview !== currentPreview) showPreview(state.preview);
      });
    }

    function updateSettings() {
      const detached = document.getElementById('detached').checked;
      document.getElementById('position').disabled = detached;
      document.getElementById('autohide').disabled = detached;
      if (settings.every(input => input.checkValidity())) {
        const values = Object.fromEntries(settings.map(input => [
          input.id, input.type === 'checkbox' ? input.checked
            : input.type === 'number' ? input.valueAsNumber : input.value
        ]));
        const basemap = basemaps.get(values.basemap) || {url: values.basemap, attribution: ''};
        values.basemapUrl = basemap.url;
        values.basemapAttribution = basemap.attribution;
        bridge.setOptions(JSON.stringify(values));
      }
      updateState();
    }

    new QWebChannel(qt.webChannelTransport, channel => {
      bridge = channel.objects.bridge;
      bridge.stateChanged.connect(updateState);
      bridge.previewChanged.connect(showPreview);
      document.getElementById('retry').addEventListener('click', () => bridge.retry());
      layerSelect.addEventListener('change', () => bridge.selectLayer(layerSelect.value));
      settings.forEach(input => input.addEventListener('change', updateSettings));
      document.querySelectorAll('[data-action]').forEach(button => {
        button.addEventListener('click', () => bridge.action(button.dataset.action));
      });
      updateSettings();
    });
  </script>
  </template>

</body>

</html>
